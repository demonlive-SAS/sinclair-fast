name: Update Sinclair playlist

on:
  schedule:
    - cron: "0 */4 * * *"   # every 4 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sinclair-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run scraper
        env:
          EPG_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/sinclair.xml.gz
        run: python sinclair.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sinclair.m3u sinclair.xml.gz
          git diff --staged --quiet || (git commit -m "Update playlist and EPG" && git push)
